[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cbow-from-scratch"
version = "0.1.0"
description = "Continuous Bag-of-Words implemented from scratch with NumPy and manual backpropagation"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.24",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]